<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Alisson Lanches — Barretos</title>
    <script type="text/javascript">
      // Técnica "spa-github-pages" (https://github.com/rafgraph/spa-github-pages)
      // O GitHub Pages não sabe que rotas como /cardapio ou /entrar pertencem
      // ao React Router — ele procura um arquivo físico com esse nome e não
      // acha, mostrando 404. Este script pega a rota pedida e redireciona
      // de volta pro index.html, que devolve pro React decidir o que mostrar.
      var pathSegmentsToKeep = 1; // 1 = link padrão usuario.github.io/alisson-lanches

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>

    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Completa a técnica do 404.html: recebe a rota codificada e restaura
      // a URL real (ex: /alisson-lanches/cardapio) antes do React montar.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
